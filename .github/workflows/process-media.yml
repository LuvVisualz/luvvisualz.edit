name: Process portfolio videos
on:
  push:
    branches: [edicion-v10-prepublicacion]
    paths:
      - .github/workflows/process-media.yml
      - scripts/download_drive_masters.py
      - scripts/optimize_media.py
      - scripts/club_contact_sheet.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media tools
        run: |
          python -m pip install --disable-pip-version-check gdown pillow
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Download and verify the original MP4 files
        run: python scripts/download_drive_masters.py --output-dir "$RUNNER_TEMP/luvvisualz-originals"
      - name: Make Club de Playa review frames
        run: python scripts/club_contact_sheet.py "$RUNNER_TEMP/luvvisualz-originals/02-CLUB DE PLAYA - LA RIOJANA.mp4" "$RUNNER_TEMP/club-de-playa-review.jpg"
      - uses: actions/upload-artifact@v4
        with:
          name: club-de-playa-review
          path: ${{ runner.temp }}/club-de-playa-review.jpg
      - name: Optimize without changing the edits or duration
        run: python scripts/optimize_media.py --source-dir "$RUNNER_TEMP/luvvisualz-originals"
      - name: Check all ten page references
        run: python tests/validate_static.py --require-media
      - name: Commit optimized files to the development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/media/intersec assets/media/valla-portatil assets/media/la-riojana assets/media/lolog-lodge
          git diff --cached --quiet && exit 0
          git commit -m 'Add optimized portfolio videos'
          git push origin HEAD:edicion-v10-prepublicacion
